name: test
on: [push, workflow_dispatch]
jobs:
  test:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m unittest -v
      - run: python make_sample.py
      - name: Report must match the lesson
        shell: python
        run: |
          import subprocess, sys
          out = subprocess.run([sys.executable, "spendsum.py", "sample/spending.csv"], capture_output=True, text=True, check=True).stdout
          a = out.replace("\r\n", "\n").replace("\\", "/").strip()
          b = open("expected_output.txt", encoding="utf-8").read().strip()
          assert a == b, "output differs:\n" + a
          print("Report output matches the lesson.")
